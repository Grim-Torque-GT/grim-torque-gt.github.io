<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stable Fast Player</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  font-family:Arial;
  overflow:hidden;
}

.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.input{
  padding:10px;
  display:flex;
  justify-content:center;
}

input{
  width:80vw;
  padding:12px;
  border-radius:999px;
  border:1px solid #333;
  background:#111;
  color:#fff;
}

.video{
  width:100vw;
  height:calc(100vh - 60px);
  position:relative;
}

#ytPlayer,#dmPlayer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div class="app">

<div class="input">
  <input id="url" placeholder="Paste YouTube or Dailymotion URL">
</div>

<div class="video">
  <div id="ytPlayer"></div>
  <div id="dmPlayer"></div>
</div>

</div>

<!-- YouTube -->
<script src="https://www.youtube.com/iframe_api"></script>

<!-- Dailymotion -->
<script src="https://api.dmcdn.net/all.js"></script>

<script>

let ytPlayer = null;
let dmPlayer = null;

let ytTimer = null;   // debounce fix

/* ---------- FAST ID ---------- */
function getYT(url){
  try{
    const u=new URL(url);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
  }catch(e){}
  return null;
}

function getDM(url){
  const m=url.match(/(?:video\/|dai\.ly\/)([a-zA-Z0-9]+)/);
  return m?m[1]:null;
}

/* ---------- MAIN INPUT (DEBOUNCED) ---------- */
function handleInput(){
  clearTimeout(ytTimer);

  ytTimer = setTimeout(()=>{
    loadVideo();
  },250); // ⚡ prevents lag
}

document.getElementById("url").addEventListener("input", handleInput);
document.getElementById("url").addEventListener("paste", ()=>setTimeout(handleInput,0));

/* ---------- LOAD ---------- */
function loadVideo(){

  const url=document.getElementById("url").value.trim();

  const yt=getYT(url);
  const dm=getDM(url);

  /* ================= YOUTUBE (FAST + STABLE) ================= */
  if(yt){

    document.getElementById("dmPlayer").style.display="none";
    document.getElementById("ytPlayer").style.display="block";

    if(!ytPlayer){
      ytPlayer = new YT.Player("ytPlayer",{
        videoId:yt,
        playerVars:{
          autoplay:1,
          mute:1,
          rel:0
        },
        events:{
          onReady:(e)=>{
            e.target.playVideo();
          }
        }
      });
    }else{
      ytPlayer.loadVideoById(yt); // ⚡ stable reload
      ytPlayer.playVideo();
    }
  }

  /* ================= DAILYMOTION (FIXED + VOLUME WORKS) ================= */
  else if(dm){

    document.getElementById("ytPlayer").style.display="none";
    document.getElementById("dmPlayer").style.display="block";

    if(!dmPlayer){

      dmPlayer = DM.player("dmPlayer",{
        video:dm,
        params:{
          autoplay:true
        }
      });

      dmPlayer.addEventListener("apiready",()=>{
        dmPlayer.play();
      });

    }else{
      dmPlayer.load(dm);
      dmPlayer.play();
    }
  }
}

/* YouTube API hook */
function onYouTubeIframeAPIReady(){}

</script>

</body>
</html>
