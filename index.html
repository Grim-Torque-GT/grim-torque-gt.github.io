<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixed Video Player</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial;
}

.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.input{
  padding:10px;
  display:flex;
  justify-content:center;
}

input{
  width:80vw;
  padding:12px;
  border-radius:999px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  outline:none;
}

.video{
  width:100vw;
  height:calc(100vh - 60px);
  position:relative;
  background:#000;
}

/* players */
#ytPlayer,#dmPlayer{
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
  display:none;
}

.hidden{
  display:none;
}

#logoOverlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

#logoOverlay img{
  width:min(45vw,520px);
  max-width:80%;
  height:auto;
  object-fit:contain;
}
</style>
</head>

<body>

<div class="app">

<div class="input">
  <input id="url" placeholder="Paste YouTube or Dailymotion URL">
</div>

<div class="video">
  <div id="ytPlayer"></div>

  <!-- ONLY DAILYMOTION (OLD STABLE METHOD) -->
  <iframe
    id="dmPlayer"
    title="Dailymotion Player"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen>
  </iframe>
  <div id="logoOverlay">
    <img src="bypass-ads.png" alt="Bypass Ads Logo">
  </div>
</div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let ytPlayer = null;
let ytReady = false;

/* ---------------- URL PARSERS ---------------- */
function getYT(url){
  try{
    const u=new URL(url);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
  }catch(e){}
  return null;
}

function getDM(url){
  try{
    const u = new URL(url);

    if(u.hostname.includes("dai.ly")){
      return u.pathname.replace("/","").split("_")[0] || null;
    }

    if(u.hostname.includes("dailymotion.com")){
      const m = u.pathname.match(/video\/([a-zA-Z0-9]+)/);
      if(m) return m[1];

      const q = u.searchParams.get("video");
      if(q) return q.split("_")[0];
    }

  }catch(e){}
  return null;
}

/* ---------------- DAILYMOTION (RESTORED OLD STYLE) ---------------- */
function playDailymotion(dmId){

  const iframe = document.getElementById("dmPlayer");

  /* hide youtube */
  document.getElementById("ytPlayer").style.display = "none";
  document.getElementById("logoOverlay").style.display = "none";

  /* show dm iframe */
  iframe.style.display = "block";

  /* OLD STABLE PLAYER */
  iframe.src =
    "https://geo.dailymotion.com/player.html?video=" +
    dmId +
    "&autoplay=1&mute=1&queue-enable=false";
}

/* ---------------- YOUTUBE ---------------- */
function loadYouTube(id){

  document.getElementById("dmPlayer").style.display = "none";
  document.getElementById("ytPlayer").style.display = "block";
  document.getElementById("logoOverlay").style.display = "none";

  if(!ytPlayer){
    ytPlayer = new YT.Player("ytPlayer",{
      videoId:id,
      playerVars:{
        autoplay:1,
        mute:1,
        rel:0
      }
    });
  }else{
    ytPlayer.loadVideoById(id);
  }
}

/* ---------------- MAIN ---------------- */
function loadVideo(){

  const url = document.getElementById("url").value.trim();

  const yt = getYT(url);
  const dm = getDM(url);

  if(yt && ytReady){
    loadYouTube(yt);
  }
  else if(dm){
    playDailymotion(dm);
  }else{
    document.getElementById("ytPlayer").style.display = "none";
    document.getElementById("dmPlayer").style.display = "none";
    document.getElementById("logoOverlay").style.display = "flex";
  }
}

/* ---------------- INPUT ---------------- */
let timer;

document.getElementById("url").addEventListener("input",()=>{
  clearTimeout(timer);
  timer = setTimeout(loadVideo, 200);
});

document.getElementById("url").addEventListener("paste",()=>{
  setTimeout(loadVideo, 0);
});

/* ---------------- YT READY ---------------- */
function onYouTubeIframeAPIReady(){
  ytReady = true;
}

</script>

</body>
</html>
