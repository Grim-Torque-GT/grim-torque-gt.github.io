<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Video Player</title>

<style>
:root{
  --bg:#0f0f0f;
  --panel:#181818;
  --panel2:#202020;
  --text:#fff;
  --accent:#ff0033;
  --border:#2a2a2a;
  --glow:0 0 12px rgba(255,0,51,0.4);
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

.app{
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* Tabs */
.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

.tab-btn{
  padding:10px 18px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:#fff;
  cursor:pointer;
}

.tab-btn.active{
  background:var(--accent);
  box-shadow:var(--glow);
  border-color:var(--accent);
}

.panel{ display:none; }
.panel.active{ display:block; }

/* Input */
.input-row{
  display:flex;
  justify-content:center;
}

input{
  width:70%;
  padding:12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:#fff;
  outline:none;
}

input:focus{
  border-color:var(--accent);
  box-shadow:var(--glow);
}

/* Video */
.video-wrap{
  margin-top:14px;
  height:65vh;
  min-height:320px;
  border-radius:16px;
  overflow:hidden;
  background:#000;
  border:1px solid var(--border);
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* error */
.error{
  text-align:center;
  color:#ff4d4d;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<!-- Tabs -->
<div class="tabs">
  <button id="tabDM" class="tab-btn active" onclick="switchTab('dm')">Dailymotion</button>
  <button id="tabYT" class="tab-btn" onclick="switchTab('yt')">YouTube</button>
</div>

<!-- Dailymotion -->
<div id="dmPanel" class="panel active">

  <div class="input-row">
    <input id="dmInput" placeholder="Paste Dailymotion URL (auto play)">
  </div>

  <div id="dmError" class="error" style="display:none;">Invalid Dailymotion URL</div>

  <div id="dmBox" class="video-wrap" style="display:none;">
    <iframe id="dmFrame"></iframe>
  </div>
</div>

<!-- YouTube -->
<div id="ytPanel" class="panel">

  <div class="input-row">
    <input id="ytInput" placeholder="Paste YouTube URL (auto play)">
  </div>

  <div id="ytError" class="error" style="display:none;">Invalid YouTube URL</div>

  <div id="ytBox" class="video-wrap" style="display:none;">
    <div id="ytPlayer"></div>
  </div>

</div>

</div>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

/* Tabs */
function switchTab(t){
  document.getElementById("tabDM").classList.toggle("active",t==="dm");
  document.getElementById("tabYT").classList.toggle("active",t==="yt");

  document.getElementById("dmPanel").classList.toggle("active",t==="dm");
  document.getElementById("ytPanel").classList.toggle("active",t==="yt");
}

/* -------- DAILYMOTION AUTO -------- */
function parseDM(url){
  const m = url.match(/(?:video\/|dai\.ly\/)([a-zA-Z0-9]+)/);
  return m ? m[1] : null;
}

function updateDM(){
  const url = document.getElementById("dmInput").value.trim();
  const id = parseDM(url);

  if(!id){
    document.getElementById("dmBox").style.display = url ? "none":"none";
    document.getElementById("dmError").style.display = url ? "block":"none";
    return;
  }

  document.getElementById("dmError").style.display="none";
  document.getElementById("dmBox").style.display="block";

  document.getElementById("dmFrame").src =
    "https://geo.dailymotion.com/player.html?video=" + id;
}

/* -------- YOUTUBE AUTO -------- */
function getYT(url){
  try{
    const u = new URL(url);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
  }catch(e){}
  return null;
}

function updateYT(){
  const url = document.getElementById("ytInput").value.trim();
  const id = getYT(url);

  if(!id){
    document.getElementById("ytError").style.display = url ? "block":"none";
    document.getElementById("ytBox").style.display="none";
    return;
  }

  document.getElementById("ytError").style.display="none";
  document.getElementById("ytBox").style.display="block";

  if(player){
    player.loadVideoById(id);
    return;
  }

  player = new YT.Player('ytPlayer',{
    videoId:id,
    playerVars:{
      rel:0,
      autoplay:1,
      modestbranding:1
    }
  });
}

/* -------- AUTO DETECT EVENTS -------- */
document.getElementById("dmInput").addEventListener("input", updateDM);
document.getElementById("dmInput").addEventListener("paste", ()=>setTimeout(updateDM,0));

document.getElementById("ytInput").addEventListener("input", updateYT);
document.getElementById("ytInput").addEventListener("paste", ()=>setTimeout(updateYT,0));

/* YouTube API */
function onYouTubeIframeAPIReady(){}
</script>

</body>
</html>
