<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Auto Player</title>

<!-- speed optimization -->
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://geo.dailymotion.com">

<style>
:root{
  --bg:#0f0f0f;
  --border:#2a2a2a;
  --accent:#ff0033;
}

/* FULL SCREEN FIX */
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--bg);
  overflow:hidden;
  font-family:Arial;
}

.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* INPUT */
.input-row{
  display:flex;
  justify-content:center;
  padding:10px;
  gap:10px;
}

input{
  width:80vw;
  padding:12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#202020;
  color:#fff;
  outline:none;
}

input:focus{
  border-color:var(--accent);
}

/* VIDEO FULL FIX */
.video-wrap{
  width:100vw;
  height:calc(100vh - 60px);
  background:black;
  position:relative;
  overflow:hidden;
}

/* iframe FULL STRETCH */
iframe, #ytPlayer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div class="app">

<div class="input-row">
  <input id="input" placeholder="Paste YouTube or Dailymotion URL (auto play)">
</div>

<div id="videoBox" class="video-wrap" style="display:none;">
  <div id="ytPlayer"></div>
  <iframe id="dmFrame"></iframe>
</div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let ytPlayer;

/* FAST DETECT */
function getYT(url){
  try{
    const u=new URL(url);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
  }catch(e){}
  return null;
}

function getDM(url){
  const m=url.match(/(?:video\/|dai\.ly\/)([a-zA-Z0-9]+)/);
  return m?m[1]:null;
}

/* MAIN AUTO LOAD (FAST PATH) */
function loadVideo(){
  const url=document.getElementById("input").value.trim();
  const box=document.getElementById("videoBox");
  const yt=getYT(url);
  const dm=getDM(url);

  if(yt){
    box.style.display="block";

    if(!ytPlayer){
      ytPlayer=new YT.Player("ytPlayer",{
        videoId:yt,
        playerVars:{
          autoplay:1,
          mute:1,       // required for instant autoplay
          rel:0
        },
        events:{
          onReady:(e)=>{
            e.target.playVideo();
            // attempt unmute (browser dependent)
            setTimeout(()=>e.target.unMute(),500);
          }
        }
      });
    }else{
      ytPlayer.loadVideoById(yt);
      ytPlayer.playVideo();
    }

    document.getElementById("dmFrame").style.display="none";
  }

  else if(dm){
    box.style.display="block";

    const frame=document.getElementById("dmFrame");
    frame.style.display="block";
    frame.src="https://geo.dailymotion.com/player.html?video="+dm;
  }

  else{
    box.style.display="none";
  }
}

/* SPEED OPTIMIZED EVENT (NO DELAY) */
document.getElementById("input").addEventListener("input",loadVideo);
document.getElementById("input").addEventListener("paste",()=>setTimeout(loadVideo,0));

function onYouTubeIframeAPIReady(){}
</script>

</body>
</html>
