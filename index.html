<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM + YT Advanced Player</title>

<style>
:root{
  --bg:#0f0f0f;
  --panel:#181818;
  --panel2:#202020;
  --text:#fff;
  --accent:#ff0033;
  --border:#2a2a2a;
  --glow:0 0 12px rgba(255,0,51,0.4);
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

.app{
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* Tabs */
.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

.tab-btn{
  padding:10px 18px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:#fff;
  cursor:pointer;
}

.tab-btn.active{
  background:var(--accent);
  box-shadow:var(--glow);
  border-color:var(--accent);
}

/* Panels */
.panel{ display:none; }
.panel.active{ display:block; }

/* Inputs */
.input-row{
  display:flex;
  gap:10px;
  justify-content:center;
}

input{
  padding:12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:#fff;
  width:60%;
  outline:none;
}

input:focus{
  border-color:var(--accent);
  box-shadow:var(--glow);
}

button{
  padding:10px 14px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:#fff;
  cursor:pointer;
}

button:hover{
  background:var(--accent);
  box-shadow:var(--glow);
}

/* Video container */
.video-wrap{
  position:relative;
  margin-top:14px;
  height:65vh;
  min-height:320px;
  border-radius:16px;
  overflow:hidden;
  background:black;
  border:1px solid var(--border);
}

/* iframe */
iframe{
  width:100%;
  height:100%;
  border:none;
}

/* YouTube controls overlay */
.controls{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:rgba(0,0,0,0.65);
  border-radius:12px;
  backdrop-filter:blur(6px);
}

.slider{
  flex:1;
}

/* error */
.error{
  text-align:center;
  color:#ff4d4d;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<!-- Tabs -->
<div class="tabs">
  <button id="tabDM" class="tab-btn active" onclick="switchTab('dm')">Dailymotion</button>
  <button id="tabYT" class="tab-btn" onclick="switchTab('yt')">YouTube</button>
</div>

<!-- DAILYMOTION -->
<div id="dmPanel" class="panel active">

  <div class="input-row">
    <input id="dmInput" placeholder="Paste Dailymotion URL">
    <button onclick="loadDM()">Load</button>
  </div>

  <div class="error" id="dmError" style="display:none;">Invalid Dailymotion URL</div>

  <div class="video-wrap" id="dmBox" style="display:none;">
    <iframe id="dmFrame"></iframe>
  </div>
</div>

<!-- YOUTUBE -->
<div id="ytPanel" class="panel">

  <div class="input-row">
    <input id="ytInput" placeholder="Paste YouTube URL">
    <button onclick="loadYT()">Load</button>
  </div>

  <div class="error" id="ytError" style="display:none;">Invalid YouTube URL</div>

  <div class="video-wrap" id="ytBox" style="display:none;">
    <div id="ytPlayer"></div>

    <!-- Overlay Controls -->
    <div class="controls">
      <button onclick="togglePlay()">▶ / ⏸</button>
      <button onclick="toggleMute()">🔇</button>
      <input class="slider" type="range" min="0" max="100" value="50" oninput="setVolume(this.value)">
      <button onclick="fullscreen()">⛶</button>
    </div>
  </div>

</div>

</div>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

/* Tabs */
function switchTab(t){
  document.getElementById("tabDM").classList.toggle("active",t==="dm");
  document.getElementById("tabYT").classList.toggle("active",t==="yt");

  document.getElementById("dmPanel").classList.toggle("active",t==="dm");
  document.getElementById("ytPanel").classList.toggle("active",t==="yt");
}

/* Dailymotion */
function loadDM(){
  const url = document.getElementById("dmInput").value.trim();
  const match = url.match(/(?:video\/|dai\.ly\/)([a-zA-Z0-9]+)/);

  if(!match){
    document.getElementById("dmError").style.display="block";
    document.getElementById("dmBox").style.display="none";
    return;
  }

  document.getElementById("dmError").style.display="none";
  document.getElementById("dmBox").style.display="block";
  document.getElementById("dmFrame").src =
    "https://geo.dailymotion.com/player.html?video=" + match[1];
}

/* YouTube ID */
function getYT(url){
  try{
    const u = new URL(url);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
  }catch(e){}
  return null;
}

/* YouTube load */
function loadYT(){
  const id = getYT(document.getElementById("ytInput").value);
  if(!id){
    document.getElementById("ytError").style.display="block";
    return;
  }

  document.getElementById("ytError").style.display="none";
  document.getElementById("ytBox").style.display="block";

  if(player){
    player.loadVideoById(id);
    return;
  }

  player = new YT.Player('ytPlayer',{
    videoId:id,
    playerVars:{rel:0, modestbranding:1}
  });
}

/* Controls */
function togglePlay(){
  const state = player.getPlayerState();
  state===1 ? player.pauseVideo() : player.playVideo();
}

function toggleMute(){
  player.isMuted() ? player.unMute() : player.mute();
}

function setVolume(v){
  player.setVolume(v);
}

function fullscreen(){
  document.getElementById("ytBox").requestFullscreen();
}

/* API ready */
function onYouTubeIframeAPIReady(){}
</script>

</body>
</html>
