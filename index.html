<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Fullscreen Player</title>

<style>
:root{
  --bg:#0f0f0f;
  --panel:#181818;
  --panel2:#202020;
  --text:#fff;
  --accent:#ff0033;
  --border:#2a2a2a;
  --glow:0 0 12px rgba(255,0,51,0.4);
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:#fff;
  overflow:hidden;
}

/* APP (disabled when video active) */
.app{
  max-width:900px;
  margin:auto;
  padding:16px;
  transition:0.2s;
}

/* Disable all UI when video is active */
.app.locked{
  pointer-events:none;
  opacity:0.2;
}

/* Tabs */
.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

.tab-btn{
  padding:10px 18px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:#fff;
}

/* Inputs */
input{
  width:70%;
  padding:12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:#fff;
}

/* VIDEO FULLSCREEN */
.video-wrap{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#000;
  display:none;
  z-index:9999;
}

/* iframe fills screen */
iframe{
  width:100%;
  height:100%;
  border:none;
}

/* overlay controls */
.controls{
  position:absolute;
  bottom:20px;
  left:20px;
  right:20px;
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px;
  background:rgba(0,0,0,0.6);
  border-radius:12px;
  backdrop-filter:blur(8px);
  pointer-events:auto;
}

button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid #333;
  background:#222;
  color:#fff;
  cursor:pointer;
}

button:hover{
  background:var(--accent);
  box-shadow:var(--glow);
}

.slider{ flex:1; }

.error{
  text-align:center;
  color:#ff4d4d;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="app" id="app">

<!-- INPUT UI -->
<div class="tabs">
  <button>Auto Player</button>
</div>

<div style="display:flex;justify-content:center;">
  <input id="urlInput" placeholder="Paste YouTube or Dailymotion URL">
</div>

<div id="error" class="error" style="display:none;">Invalid URL</div>

</div>

<!-- FULLSCREEN VIDEO -->
<div class="video-wrap" id="videoBox">

  <div id="ytPlayer"></div>

  <!-- Controls -->
  <div class="controls">
    <button onclick="togglePlay()">▶ / ⏸</button>
    <button onclick="toggleMute()">🔇</button>
    <input class="slider" type="range" min="0" max="100" value="50" oninput="setVolume(this.value)">
    <button onclick="exitVideo()">❌</button>
  </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

/* lock UI */
function lockUI(state){
  document.getElementById("app").classList.toggle("locked", state);
}

/* detect YouTube */
function getYT(url){
  try{
    const u = new URL(url);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
  }catch(e){}
  return null;
}

/* detect Dailymotion */
function getDM(url){
  const m = url.match(/(?:video\/|dai\.ly\/)([a-zA-Z0-9]+)/);
  return m ? m[1] : null;
}

/* AUTO LOAD */
document.getElementById("urlInput").addEventListener("input", function(){
  const url = this.value.trim();

  const yt = getYT(url);
  const dm = getDM(url);

  if(yt){
    openVideo("yt", yt);
  } else if(dm){
    openVideo("dm", dm);
  }
});

/* OPEN VIDEO */
function openVideo(type,id){
  document.getElementById("videoBox").style.display="block";
  lockUI(true);

  if(type==="yt"){
    if(player){
      player.loadVideoById(id);
      return;
    }

    player = new YT.Player('ytPlayer',{
      videoId:id,
      playerVars:{
        autoplay:1,
        rel:0,
        modestbranding:1
      }
    });
  }

  if(type==="dm"){
    document.getElementById("ytPlayer").innerHTML =
      `<iframe src="https://geo.dailymotion.com/player.html?video=${id}" allowfullscreen></iframe>`;
  }
}

/* CONTROLS */
function togglePlay(){
  if(player){
    const s = player.getPlayerState();
    s===1 ? player.pauseVideo() : player.playVideo();
  }
}

function toggleMute(){
  if(player){
    player.isMuted() ? player.unMute() : player.mute();
  }
}

function setVolume(v){
  if(player) player.setVolume(v);
}

/* EXIT FULLSCREEN */
function exitVideo(){
  document.getElementById("videoBox").style.display="none";
  document.getElementById("ytPlayer").innerHTML="";
  lockUI(false);
}
</script>

</body>
</html>
