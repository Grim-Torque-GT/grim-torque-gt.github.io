<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Fullscreen Player</title>

<style>
:root{
  --bg:#000;
  --accent:#ff0033;
  --border:#222;
}

html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--bg);
  overflow:hidden;
  font-family:Arial;
}

/* App wrapper */
.app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
}

/* Top bar */
.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:10;
  display:flex;
  justify-content:center;
  padding:10px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(6px);
}

input{
  width:70%;
  max-width:700px;
  padding:12px 14px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#111;
  color:#fff;
  outline:none;
}

input:focus{
  border-color:var(--accent);
  box-shadow:0 0 12px rgba(255,0,51,0.4);
}

/* FULL SCREEN VIDEO */
.video-wrap{
  position:absolute;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
}

.video-wrap iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
}

/* error */
.error{
  position:absolute;
  top:60px;
  width:100%;
  text-align:center;
  color:#ff4d4d;
  font-size:14px;
  z-index:11;
}
</style>
</head>

<body>

<div class="app">

  <!-- Input -->
  <div class="topbar">
    <input id="urlInput" placeholder="Paste YouTube or Dailymotion URL (auto play)">
  </div>

  <div id="error" class="error" style="display:none;"></div>

  <!-- Video -->
  <div class="video-wrap" id="videoBox" style="display:none;">
    <iframe id="frame"></iframe>
    <div id="ytPlayer"></div>
  </div>

</div>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

/* Detect tab */
function getYT(url){
  try{
    const u = new URL(url);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
  }catch(e){}
  return null;
}

function getDM(url){
  const m = url.match(/(?:video\/|dai\.ly\/)([a-zA-Z0-9]+)/);
  return m ? m[1] : null;
}

/* MAIN AUTO DETECT */
function loadVideo(){
  const url = document.getElementById("urlInput").value.trim();
  const error = document.getElementById("error");

  const yt = getYT(url);
  const dm = getDM(url);

  document.getElementById("videoBox").style.display="block";

  /* YOUTUBE */
  if(yt){
    error.style.display="none";

    if(player){
      player.loadVideoById(yt);
      return;
    }

    player = new YT.Player('frame',{
      videoId:yt,
      playerVars:{
        autoplay:1,
        rel:0,
        modestbranding:1
      }
    });

    return;
  }

  /* DAILYMOTION */
  if(dm){
    error.style.display="none";

    document.getElementById("frame").src =
      "https://geo.dailymotion.com/player.html?video=" + dm;

    return;
  }

  /* INVALID */
  document.getElementById("videoBox").style.display="none";
  error.innerText="Invalid URL";
  error.style.display="block";
}

/* AUTO DETECT ON TYPE + PASTE */
document.getElementById("urlInput").addEventListener("input", loadVideo);
document.getElementById("urlInput").addEventListener("paste", ()=>setTimeout(loadVideo,0));

/* YouTube API */
function onYouTubeIframeAPIReady(){}
</script>

</body>
</html>
