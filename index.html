<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixed Video Player</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial;
}

.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.input{
  padding:10px;
  display:flex;
  justify-content:center;
}

input{
  width:80vw;
  padding:12px;
  border-radius:999px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  outline:none;
}

/* IMPORTANT: stable layout (NOT aggressive absolute until ready) */
.video{
  width:100vw;
  height:calc(100vh - 60px);
  position:relative;
  background:#000;
}

/* SAFE CONTAINER (fixes Dailymotion blank screen) */
#ytPlayer,#dmPlayer{
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
}

/* ensure hidden state doesn't collapse layout */
.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="app">

<div class="input">
  <input id="url" placeholder="Paste YouTube or Dailymotion URL">
</div>

<div class="video">
  <div id="ytPlayer"></div>
  <div id="dmPlayer"></div>
</div>

</div>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<!-- Dailymotion API -->
<script src="https://api.dmcdn.net/all.js"></script>

<script>

let ytPlayer = null;
let dmPlayer = null;
let ytReady = false;
let dmReady = false;

/* ---------------- URL PARSERS ---------------- */
function getYT(url){
  try{
    const u=new URL(url);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
  }catch(e){}
  return null;
}

function getDM(url){
  const m=url.match(/(?:video\/|dai\.ly\/)([a-zA-Z0-9]+)/);
  return m?m[1]:null;
}

/* ---------------- INPUT (DEBOUNCED FOR SPEED) ---------------- */
let timer=null;

document.getElementById("url").addEventListener("input",()=>{
  clearTimeout(timer);
  timer=setTimeout(loadVideo,200);
});

document.getElementById("url").addEventListener("paste",()=>{
  setTimeout(loadVideo,0);
});

/* ---------------- MAIN ---------------- */
function loadVideo(){

  const url=document.getElementById("url").value.trim();

  const yt=getYT(url);
  const dm=getDM(url);

  /* ================= YOUTUBE (FAST SWITCH) ================= */
  if(yt && ytReady){

    document.getElementById("dmPlayer").style.display="none";
    document.getElementById("ytPlayer").style.display="block";

    if(!ytPlayer){

      ytPlayer = new YT.Player("ytPlayer",{
        videoId:yt,
        playerVars:{
          autoplay:1,
          mute:1,
          rel:0
        },
        events:{
          onReady:(e)=>{
            e.target.playVideo();
          }
        }
      });

    }else{
      ytPlayer.cueVideoById(yt);   // ⚡ fastest + no reload lag
      ytPlayer.playVideo();
    }
  }

  /* ================= DAILYMOTION (FIXED STABLE INIT) ================= */
  else if(dm && dmReady){

    document.getElementById("ytPlayer").style.display="none";
    document.getElementById("dmPlayer").style.display="block";

    // ⚠️ CRITICAL: wait layout paint before init
    requestAnimationFrame(()=>{

      if(!dmPlayer){

        dmPlayer = DM.player("dmPlayer",{
          video:dm,
          width:"100%",
          height:"100%",
          params:{
            autoplay:true
          }
        });

        dmPlayer.addEventListener("apiready",()=>{
          dmPlayer.play();
        });

      }else{
        dmPlayer.load(dm);
        dmPlayer.play();
      }

    });
  }
}

/* ---------------- YOUTUBE READY ---------------- */
function onYouTubeIframeAPIReady(){
  ytReady = true;
}

/* ---------------- DAILYMOTION READY ---------------- */
window.dmAsyncInit = function(){
  dmReady = true;
};

</script>

</body>
</html>
